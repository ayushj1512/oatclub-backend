<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miray Promo Email Preview</title>

    <!-- ✅ Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
    <!-- Email Wrapper -->
    <div class="w-full max-w-[720px] bg-white shadow-xl rounded-xl overflow-hidden">
      
      <!-- Clickable Image -->
      <a
        href="https://mirayfashions.com?utm_source=miray&utm_medium=email&utm_campaign=welcome10_offer&utm_content=promo_banner"
        target="_blank"
        class="block"
      >
        <img
          src="https://res.cloudinary.com/djtva6hec/image/upload/v1767863578/miray/media/dr06bw6oqa511xr2dsve.jpg"
          alt="Miray Fashions Promo"
          class="w-full h-auto block"
        />
      </a>

      <!-- Footer (Optional Preview Footer) -->
      <div class="px-6 py-4 text-center text-xs text-gray-500">
        Having trouble viewing this email?  
        <a
          href="https://mirayfashions.com?utm_source=miray&utm_medium=email&utm_campaign=welcome10_offer&utm_content=promo_banner"
          target="_blank"
          class="text-black underline font-medium"
        >
          Open in browser
        </a>
      </div>
    </div>
  </body>
</html>
